<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1600px;height:196px}
  body{
    background:#f1efe7; font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; justify-content:center; gap:26px;
    padding:0 80px; overflow:hidden;
  }
  .eyebrow{display:flex; align-items:center; gap:20px}
  .eyebrow span{font-size:15px; letter-spacing:.24em; text-transform:uppercase; color:#6d7480; font-weight:600; white-space:nowrap}
  .eyebrow i{flex:1; height:1px; background:#d3cfc2}

  .row{display:flex; align-items:center; justify-content:space-between; gap:44px}
  .cell{display:flex; align-items:center; gap:12px; flex:0 0 auto}
  .cell img{mix-blend-mode:multiply; display:block}
  .logo{max-height:38px; width:auto}
  .icon{height:52px; width:52px; mix-blend-mode:normal}
  .ao-word{font-size:29px; font-weight:800; letter-spacing:-.02em; color:#1e283d}
  .host{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#8a9098; font-weight:600; margin-left:2px}
</style></head>
<body>
  <div class="eyebrow"><span>Powered by</span><i></i></div>
  <div class="row">
    <div class="cell"><img class="icon" src="logos/ao.svg" alt="AO"><span class="ao-word">AO</span><span class="host">host</span></div>
    <div class="cell"><img class="logo" src="logos/maximor.jpg" alt="Maximor"></div>
    <div class="cell"><img class="logo" src="logos/dodo.jpg" alt="Dodo Payments"></div>
    <div class="cell"><img class="logo" src="logos/tensormux.jpg" alt="TensorMux"></div>
    <div class="cell"><img class="logo" src="logos/neatlogs.jpg" alt="Neatlogs"></div>
    <div class="cell"><img class="logo" src="logos/aigrants.jpg" alt="AI Grants India"></div>
  </div>
</body></html>
